# FlowBench v0.1 — smoke run (< 1 minute end to end).
# Used by `make smoke`, the integration tests and CI. Same schema as default.yaml,
# with sample caps and a short training budget. CI runs on CPU with synthetic data.

run:
  name: smoke
  seed: 0
  device: auto
  artifacts_dir: artifacts
  log_level: INFO
  deterministic: true

data:
  root_dir: data
  manifest_path: data/manifest.json
  zenodo_record_id: "12825163"
  source_resolution: 128
  resolution: 32
  n_train_available: 10000
  n_test_available: 2000
  max_train_samples: 320
  max_test_samples: 64
  val_fraction: 0.1
  split_seed: 0
  num_workers: 0

model:
  name: cnn
  cnn:
    layers: 4
    channels: 32
    kernel_size: 3
    padding_mode: zeros
    residual: true

training:
  epochs: 3
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0
  early_stopping_patience: 2
  log_every_n_steps: 5

evaluation:
  batch_size: 32
  relative_l2_epsilon: 1.0e-8
  high_vorticity_quantile: 0.9
  n_error_maps: 2
  latency:
    warmup_iterations: 3
    timed_iterations: 10
  metrics_tolerance: 1.0e-5

serving:
  host: 127.0.0.1
  port: 8000
  checkpoint_dir: null

ui:
  port: 8501
  n_preview_samples: 32
